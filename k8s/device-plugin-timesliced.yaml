# Optional experiment (Phase 6): advertise the single RTX 3090 as two
# time-sliced nvidia.com/gpu units. This is TEMPORAL sharing: both workloads
# run on the same physical GPU, the SM time-slices between their kernels, and
# GPU memory is NOT hardware-isolated. Each pod still sees the full card and
# must voluntarily cap its own allocation (vLLM gpu-memory-utilization).
# Apply over k8s/device-plugin.yaml; revert by re-applying that file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-timeslicing
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: true
        resources:
          - name: nvidia.com/gpu
            replicas: 2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin@sha256:27c1b2553a690ca3d29889dcd61df97525d46f58272c0be8dc63c2b18f120075
          args: ["--config-file=/etc/nvidia-device-plugin/config.yaml"]
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: timeslicing-config
              mountPath: /etc/nvidia-device-plugin
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: timeslicing-config
          configMap:
            name: nvidia-device-plugin-timeslicing
